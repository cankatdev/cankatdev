name: Remove private email from profile history
on:
  push:
    branches: [main]
    paths: [.github/workflows/privacy.yml]
permissions:
  contents: write
concurrency:
  group: refresh-profile
  cancel-in-progress: false
jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Replace private email and verify history
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PYTHON'
          import base64
          import json
          import os
          import urllib.parse
          import urllib.request
          
          repository = os.environ['GITHUB_REPOSITORY']
          username = repository.split('/')[0]
          noreply = '255551256+cankatdev@users.noreply.github.com'
          token = os.environ['GH_TOKEN']
          
          
          def api(path, payload=None, method=None):
              request = urllib.request.Request(
                  'https://api.github.com/repos/' + repository + '/' + path,
                  data=None if payload is None else json.dumps(payload).encode(),
                  headers={
                      'Authorization': 'Bearer ' + token,
                      'Accept': 'application/vnd.github+json',
                      'Content-Type': 'application/json',
                      'User-Agent': 'profile-email-cleanup',
                  },
                  method=method,
              )
              with urllib.request.urlopen(request, timeout=30) as response:
                  return json.load(response)
          
          
          initial = api('git/ref/heads/main')['object']['sha']
          commits = api('commits?sha=' + initial + '&per_page=100')
          if len(commits) >= 100:
              raise RuntimeError('History exceeds the reviewed cleanup scope')
          private_emails = set()
          for item in commits:
              for role in ('author', 'committer'):
                  identity = item.get(role) or {}
                  email = item['commit'][role]['email']
                  if identity.get('login') == username and not email.endswith('noreply.github.com'):
                      private_emails.add(email)
          if not private_emails:
              raise RuntimeError('No private author emails found; no rewrite performed')
          
          mapping = {}
          previous = None
          for item in reversed(commits):
              parents = [parent['sha'] for parent in item['parents']]
              expected = [] if previous is None else [previous]
              if parents != expected:
                  raise RuntimeError('History is no longer the reviewed linear history')
              commit = item['commit']
              tree = commit['tree']['sha']
              readme = api('contents/README.md?ref=' + item['sha'])
              content = base64.b64decode(readme['content']).decode()
              updated = content
              for old, new in mapping.items():
                  updated = updated.replace('/' + old + '/profile-card.svg', '/' + new + '/profile-card.svg')
              if updated != content:
                  tree = api('git/trees', {
                      'base_tree': tree,
                      'tree': [{'path': 'README.md', 'mode': '100644', 'type': 'blob', 'content': updated}],
                  })['sha']
              body = {
                  'message': commit['message'],
                  'tree': tree,
                  'parents': [mapping[parent] for parent in parents],
              }
              for role in ('author', 'committer'):
                  identity = dict(commit[role])
                  if identity['email'] in private_emails:
                      identity['email'] = noreply
                  body[role] = identity
              created = api('git/commits', body)
              for role in ('author', 'committer'):
                  if created[role]['email'] in private_emails:
                      raise RuntimeError('Private email remains in a rewritten commit')
              mapping[item['sha']] = created['sha']
              previous = item['sha']
          
          # Remove this temporary maintenance workflow from the final file tree.
          tip = api('git/commits/' + mapping[initial])
          tree = api('git/trees', {
              'base_tree': tip['tree']['sha'],
              'tree': [{'path': '.github/workflows/privacy.yml', 'mode': '100644', 'type': 'blob', 'sha': None}],
          })['sha']
          identity = {'name': username, 'email': noreply}
          clean_head = api('git/commits', {
              'message': 'Finish email privacy cleanup',
              'tree': tree,
              'parents': [mapping[initial]],
              'author': identity,
              'committer': identity,
          })['sha']
          if api('git/ref/heads/main')['object']['sha'] != initial:
              raise RuntimeError('Branch changed during cleanup; no history was replaced')
          api('git/refs/heads/main', {'sha': clean_head, 'force': True}, method='PATCH')
          verified = api('commits?sha=' + clean_head + '&per_page=100')
          if any(item['commit'][role]['email'] in private_emails for item in verified for role in ('author', 'committer')):
              raise RuntimeError('Verification found a private email')
          print('Rewrote', len(commits), 'commits. Personal emails removed from main history.')
          print('Temporary workflow removed. Profile image references remapped.')
          PYTHON
