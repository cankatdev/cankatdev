name: Refresh profile
on:
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - profile.json
      - assets/icons.json
      - scripts/update_profile.py
      - .github/workflows/profile.yml

permissions:
  contents: write

concurrency:
  group: refresh-profile
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out profile source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Fetch GitHub data and refresh card
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/update_profile.py --publish
